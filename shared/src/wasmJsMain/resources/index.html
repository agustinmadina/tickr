<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0B0D10">
    <meta name="description" content="Tickr — a Kotlin Multiplatform crypto portfolio with live prices, running from the same code on Android, iOS and the web.">

</html>
