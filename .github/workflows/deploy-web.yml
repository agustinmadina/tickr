name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deployment needs an OIDC token; nothing here writes to the repo.
permissions:
  contents: read
  pages: write
  id-token: write

# Keyed on the workflow, not the commit: only the newest deploy is worth finishing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - run: ./gradlew :shared:wasmJsBrowserDistribution --no-daemon

      - uses: actions/upload-pages-artifact@v4
        with:
          path: shared/build/dist/wasmJs/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
