name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that can run on Linux: format, tests, and the two targets that cross-compile there.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Formatting
        run: ./gradlew ktlintCheck

      - name: Tests
        run: ./gradlew testAndroidHostTest

      - name: Android and web build
        run: ./gradlew :androidApp:assembleDebug :shared:wasmJsBrowserDistribution

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: warn

  # iOS needs a macOS runner, so it is a separate job rather than a step. Without it the third
  # target would only ever be checked on somebody's laptop, and "works on all three" would be a
  # claim rather than a fact.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Link the iOS framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64
