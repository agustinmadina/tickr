kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048M -XX:+UseParallelGC
kotlin.incremental.native=true
org.gradle.jvmargs=-Xmx3072M -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.nonTransitiveRClass=true
android.useAndroidX=true
# AGP 9 otherwise rejects the module layout.
android.uniquePackageNames=false
# Required for KSP in a KMP library module.
android.disallowKotlinSourceSets=false
